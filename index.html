<!DOCTYPE html>

<head>
    <link rel="stylesheet" href="style.css" />
    <title>Assignment 2</title>
</head>
<body>
    <header>
        <h1>IT202 Assignment 2 Javier Cardoza</h1>
    </header>
    <!-- This div block is for part 1:
     Reverses the string that the user inputs -->
    <div>
        <p>Enter a string:</p>
        <input type="text" id="normal">
        <input type="submit" class="button" id="revBtn">
        <br>
        <p id="reverse"></p>
    </div>

    <!-- This div block is for part 2:
     Finds out if the number that the user inputs is a palindrome or not -->
    <div>
        <p>Is your number a palindrome?</p>
        <input type="text" id="palNum">
        <input type="submit" class="button" id="palBtn">
        <br>
        <p id="isPal"></p>
    </div>

    <!-- This div block is for part 3:
     Lets the user put in the subtotal and % tip, then calculates and displays the total -->
    <div>
        <p>Subtotal:</p>
        <input type="text" id="subtotal">
        <br>
        <p>% tip:</p>
        <input type="text" id="tip">
        <input type="submit" class="button" id="totalBtn">
        <br>
        <p id="total"></p>
    </div>

    <footer><script src="index.js"></script></footer>
</body>
